# Uso: cp infra/.env.example infra/.env && docker compose -f infra/docker-compose.yml --env-file infra/.env up -d
# Detalhes e segurança: docs/integracoes/n8n.md

x-n8n: &n8n
  image: n8nio/n8n:${N8N_VERSION:?fixe a versão do n8n em infra/.env}
  restart: unless-stopped
  environment:
    DB_TYPE: postgresdb
    DB_POSTGRESDB_HOST: postgres
    DB_POSTGRESDB_DATABASE: n8n
    DB_POSTGRESDB_USER: ${POSTGRES_USER}
    DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
    EXECUTIONS_MODE: queue
    QUEUE_BULL_REDIS_HOST: redis
    N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?gere uma chave e guarde fora do servidor}
    N8N_HOST: ${N8N_DOMINIO}
    N8N_PROTOCOL: https
    WEBHOOK_URL: https://${N8N_DOMINIO}/
    GENERIC_TIMEZONE: America/Sao_Paulo
    TZ: America/Sao_Paulo
    # LGPD: nada de dados de execuções bem-sucedidas guardados; erros guardados por 7 dias.
    EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
    EXECUTIONS_DATA_SAVE_ON_ERROR: all
    EXECUTIONS_DATA_PRUNE: "true"
    EXECUTIONS_DATA_MAX_AGE: "168"
    N8N_RUNNERS_ENABLED: "true"
    # $env liberado só para configuração de baixo risco; o token da trilha-api fica numa credencial do n8n.
    N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    TRILHA_API_URL: http://trilha-api:8080
    SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
  volumes:
    - n8n_dados:/home/node/.n8n
  depends_on: [postgres, redis]

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes: [pg_dados:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d n8n"]
      interval: 10s

  redis:
    image: redis:7
    restart: unless-stopped
    volumes: [redis_dados:/data]

  n8n:
    <<: *n8n

  n8n-worker:
    <<: *n8n
    command: worker
    depends_on: [n8n]

  trilha-api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    environment:
      TRILHA_API_TOKEN: ${TRILHA_API_TOKEN}
      TRILHA_SIMULAR: ${TRILHA_SIMULAR:-1}     # 0 só depois do teste com META_TEST_EVENT_CODE
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION}
      META_TEST_EVENT_CODE: ${META_TEST_EVENT_CODE}
      TRILHA_RESPONSAVEL_TECNICO: ${TRILHA_RESPONSAVEL_TECNICO}
    env_file: [./kommo.env]              # KOMMO_TOKEN_<CLIENTE> e KOMMO_WEBHOOK_TOKEN_<CLIENTE> (um par por cliente)
    volumes:
      - ${TRILHA_CLIENTES_DIR:?caminho do repositório privado trilha-clientes}:/clientes:ro
      - trilha_logs:/logs                # registro de envios (envios.jsonl) até o banco do ADR-001 estar no ar
    # sem porta pública: só o n8n fala com a API, pela rede interna

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      N8N_DOMINIO: ${N8N_DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dados:/data
    depends_on: [n8n]

volumes:
  n8n_dados:
  trilha_logs:
  pg_dados:
  redis_dados:
  caddy_dados:
