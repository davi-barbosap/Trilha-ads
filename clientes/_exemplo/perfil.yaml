# Perfil de exemplo: Escola Exemplo de Inglês, o mesmo cliente fictício do Trilha-briefing, do Trilha-copy e da Trilha-LP.
# Validar: python -m trilha validar clientes/_exemplo/perfil.yaml. Clientes reais ficam no Trilha-clientes (ADR-004).
# A parte de cima (cliente, métrica, economia, verba) veio do briefing (exportar --para trilha): mude lá e exporte de novo.
# A de baixo (plataformas, crm, conversao, freio, operacao) só existe depois do acesso às contas e é completada aqui.
# O perfil de teste do segmento imobiliário fica em tests/fixtures/clientes/_exemplo/.
versao: 1
vigente_desde: 2026-10-10
cliente:
  id: _exemplo
  nome: Escola Exemplo de Inglês
  segmento: padrao
metrica_principal: agendamento
economia:
  modelo_receita: recorrencia
  mensalidade: 460.0
  meses_retencao: 10.0
  margem_contribuicao: 0.45
  pct_investivel: 0.3
  taxa_fechamento: 0.08
  taxa_qualificacao: 0.4
  taxa_agendamento: 0.2
  estimados:
  - meses_retencao
  - taxa_qualificacao
verba:
  mensal_planejada: 5000.0
  teto_mensal: 6000.0
  moeda: BRL

plataformas:
  meta:
    ad_account_id: "act_000000000000001"
    pixel_id: "000000000000001"
    page_id: "000000000000001"
  google:
    customer_id: "123-456-7891"

crm:
  tipo: kommo
  subdominio: escola-exemplo
  sla_primeiro_contato_min: 15    # do time comercial da escola com o lead, em minutos de expediente
  horario_comercial: { dias: [0, 1, 2, 3, 4, 5], inicio: 8, fim: 21, fuso_utc: -3 }   # 0 = segunda; aulas até 21h
  dias_parado: 7                  # ciclo curto: lead ativo sem movimentação há mais de 7 dias = parado
  dias_base_velha: 30
  baldes: [Escola Exemplo]        # usuário da empresa: recebe leads, mas não é pessoa do time
  gestores: []
  # Código do criativo no utm_content: o padrão da grade do briefing (PT01, GB01…), que é o padrão do sistema.
  funis:
    - { pipeline_id: 2111, nome: Matrículas, papel: fechamento }
  mapa_eventos:                   # etapas padrão da Trilha (docs/raio-x-do-funil.md); 142 e 143 já são padrão
    - { pipeline_id: 2111, status_id: 3001, evento: lead }
    - { pipeline_id: 2111, status_id: 3002, evento: em_atendimento }
    - { pipeline_id: 2111, status_id: 3003, evento: lead_qualificado }
    - { pipeline_id: 2111, status_id: 3004, evento: agendamento }        # aula experimental agendada
    - { pipeline_id: 2111, status_id: 3005, evento: comparecimento }     # fez a aula experimental
    - { pipeline_id: 2111, status_id: 3006, evento: proposta }
    - { pipeline_id: 2111, status_id: 3007, evento: perdido, motivo: Não respondeu às tentativas de contato }   # Frio
  campos:
    gclid: gclid
    gbraid: gbraid
    wbraid: wbraid
    fbclid: fbclid
    ctwa_clid: ctwa_clid
    meta_lead_id: meta_lead_id
    utm_source: utm_source
    utm_campaign: utm_campaign
    utm_content: utm_content
    codigo_criativo: codigo_criativo
    origem: Origem

conversao:
  eventos_semana_aprendizado: 50
  destinos:
    lead:             { meta_event_name: Lead,            google_conversion_action_id: "910000001", valor: ponderado }
    lead_qualificado: { meta_event_name: LeadQualificado, google_conversion_action_id: "910000002", valor: ponderado }
    agendamento:      { meta_event_name: Schedule,        google_conversion_action_id: "910000003", valor: ponderado }
    comparecimento:   { meta_event_name: AulaRealizada }
    venda:            { meta_event_name: Purchase,        google_conversion_action_id: "910000004", valor: receita }

# Freio de emergência: a única ação automática (ADR-006).
freio:
  modo: avisar                    # escola nova na operação: avisa antes de pausar sozinho
  gasto_sem_lead_multiplo: 3
  horas_rastreamento_quebrado: 6

operacao:
  responsavel: Assessor responsável
  faixa: essencial
  dia_otimizacao: terca
  dia_relatorio: sexta
  semana_reuniao: 1
  dia_reuniao: quinta
