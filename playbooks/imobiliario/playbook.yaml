# Playbook imobiliário: sobrescreve playbooks/padrao/ no que é próprio do segmento.
# Ponto de partida: o perfil do cliente sobrescreve e marca o que ainda é estimado.
segmento: imobiliario

economia_padrao:
  modelo_receita: comissao
  comissao_pct: 0.05            # lançamento costuma ser menor que usado; confirmar com o cliente
  participacao_comissao: 0.5    # parte que fica com a imobiliária após repasse ao corretor
  margem_contribuicao: 0.5
  pct_investivel: 0.5
  taxa_fechamento: 0.01         # conservador; 0,5%–2% é a faixa comum (lead → venda)
  taxa_qualificacao: 0.25
  taxa_agendamento: 0.05

eixos_objecao: [preco, produto, localizacao]   # todos obrigatórios na régua de criativos e de nutrição

regras_comerciais_padrao:
  preco: { anuncio: parcela, whatsapp: nunca, landing: a_partir_de }

compliance:
  registros_profissionais: [CRECI]
  categoria_especial_anuncio: verificar   # habitação: regras variam por plataforma e país

fontes_de_lead:                 # entram no CRM com origem padronizada e no CAC total
  - meta
  - google
  - portal_zap
  - portal_vivareal
  - portal_olx
  - indicacao
  - organico

calendario:
  - { periodo: "jan–fev", nota: "retomada de busca pós-férias" }
  - { periodo: "mar", nota: "feirões de financiamento costumam ocorrer" }
  - { periodo: "nov", nota: "Black Friday imobiliária — condições com prazo" }
  - { periodo: "dez (2ª quinzena)", nota: "queda de demanda; reduzir verba de teste" }

rotulos_etapas:
  agendamento: Visita agendada
  comparecimento: Visita realizada

# Conversão esperada da etapa anterior para cada etapa. O produto delas (~1,1%) bate com a taxa de
# fechamento padrão (1%) e com a operação real da Trilha (425 leads → 4 vendas = 0,94%).
taxas_referencia:
  em_atendimento: 0.90
  lead_qualificado: 0.35
  agendamento: 0.45
  comparecimento: 0.65
  proposta: 0.35
  venda: 0.35

motivos_perda:
  Renda insuficiente para o financiamento: lead
  Procurava imóvel pronto: lead
  Procurava aluguel: lead
  Comprou com outra imobiliária: comercial
  Não gostou do imóvel na visita: comercial
  Financiamento negado: externo

perguntas_aderencia:
  - Quem comprou até agora (perfil financeiro, onde mora, o que faz, o que motivou a compra)?
  - O imóvel é para moradia ou investimento?
  - O fluxo de pagamento é flexível? Essas facilidades podem ser comunicadas?
  - Qual o histórico da construtora (entrega no prazo, reclamações)? A reputação é um ativo ou um obstáculo?
  - Como estão as vendas do empreendimento no plantão, no corpo a corpo e na indicação?
  - É alto padrão? Alto padrão raramente converte via tráfego frio.

# Imóvel pode ser moradia ou investimento, e o fluxo de pagamento direto com a construtora é argumento de venda.
aderencia_exige:
  - perfil_compradores
  - finalidade
  - pagamento_flexivel
  - reputacao
  - vendas_fora_do_digital
  - aderencia_digital
